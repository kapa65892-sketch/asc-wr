<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ASC-WR Live</title>
<style>
  :root{--bg:#0a0e14;--panel:#121823;--ink:#e8edf4;--dim:#6b7a90;--line:#1f2a3a;
  --normal:#2dd4a7;--drift:#f5a623;--wound:#4aa3ff;--fault:#ff4d5e;--shift:#9b8cff;
  --mono:"SFMono-Regular","JetBrains Mono",Consolas,monospace;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--mono);min-height:100%;}
  body{display:flex;flex-direction:column;padding:14px;gap:10px;max-width:520px;margin:0 auto;}
  .title{font-size:12px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;}
  .title b{color:var(--ink);}
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;position:relative;}
  .state-name{font-size:26px;font-weight:700;color:var(--state-color,var(--normal));}
  .action-name{font-size:14px;color:var(--dim);margin-top:3px;}
  .conf{position:absolute;top:18px;right:18px;font-size:11px;color:var(--dim);text-align:right;}
  .conf b{color:var(--ink);font-size:16px;display:block;}
  .bars{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;}
  .bar-row{display:grid;grid-template-columns:88px 1fr 50px;align-items:center;gap:9px;font-size:11px;}
  .bar-label{color:var(--dim);}
  .bar-track{height:7px;background:#0a0e14;border-radius:99px;overflow:hidden;}
  .bar-fill{height:100%;width:0%;border-radius:99px;transition:width .12s linear;}
  .bar-val{text-align:right;font-variant-numeric:tabular-nums;}
  .live{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .live div{text-align:center;}
  .live span{display:block;font-size:10px;color:var(--dim);margin-bottom:2px;}
  .live b{font-size:16px;font-variant-numeric:tabular-nums;}
  .btn{padding:16px;border:none;border-radius:14px;background:var(--normal);color:#06281f;font-family:var(--mono);font-size:15px;font-weight:700;cursor:pointer;}
  .btn:active{transform:scale(.98);}
  .btn.sec{background:var(--line);color:var(--ink);}
  .hint{font-size:11px;color:var(--dim);line-height:1.5;text-align:center;}
  .hidden{display:none!important;}
  #diag{background:#060a10;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11px;line-height:1.6;min-height:90px;white-space:pre-wrap;}
  .ok{color:var(--normal);} .err{color:var(--fault);} .warn{color:var(--drift);}
  #counter{font-size:11px;color:var(--dim);text-align:center;}
</style>
</head>
<body>
  <div class="title">ASC-WR <b>Frontal Edge</b> · live</div>

  <div id="setup">
    <div class="stage" style="text-align:center">
      <div class="state-name" style="font-size:20px">Диагностика датчика</div>
      <div class="action-name">Нажми кнопку ниже и пошевели телефон</div>
    </div>
    <div id="diag" style="margin:10px 0">готов к запуску...</div>
    <button class="btn" id="startBtn">▶ ЗАПУСТИТЬ ДАТЧИК</button>
    <p class="hint" style="margin-top:8px">Если выскочит запрос разрешения на движение — нажми «Разрешить».</p>
  </div>

  <div id="runtime" class="hidden" style="display:flex;flex-direction:column;gap:10px;">
    <div class="stage" id="stage">
      <div class="conf">уверенность<b id="conf">—</b></div>
      <div class="state-name" id="stateName">—</div>
      <div class="action-name" id="actionName">—</div>
    </div>
    <div class="bars">
      <div class="bar-row"><div class="bar-label">drift</div><div class="bar-track"><div class="bar-fill" id="barDrift" style="background:var(--drift)"></div></div><div class="bar-val" id="valDrift">0</div></div>
      <div class="bar-row"><div class="bar-label">fault risk</div><div class="bar-track"><div class="bar-fill" id="barFault" style="background:var(--fault)"></div></div><div class="bar-val" id="valFault">0</div></div>
      <div class="bar-row"><div class="bar-label">local risk</div><div class="bar-track"><div class="bar-fill" id="barLocal" style="background:var(--wound)"></div></div><div class="bar-val" id="valLocal">0</div></div>
      <div class="bar-row"><div class="bar-label">severe</div><div class="bar-track"><div class="bar-fill" id="barSevere" style="background:var(--fault)"></div></div><div class="bar-val" id="valSevere">0</div></div>
    </div>
    <div class="live">
      <div><span>accel X</span><b id="ax">0</b></div>
      <div><span>accel Y</span><b id="ay">0</b></div>
      <div><span>accel Z</span><b id="az">0</b></div>
    </div>
    <div id="counter">событий датчика: <b id="evcount">0</b></div>
    <button class="btn sec" id="recalBtn">Рекалибровка (покой)</button>
  </div>

<script>
// ===================== ASC-WR core (inline) =====================
const STATES = Object.freeze({
  NORMAL: "NORMAL",
  LOCAL_WOUND: "LOCAL_WOUND",
  IRREVERSIBLE_DRIFT: "IRREVERSIBLE_DRIFT",
  COORDINATED_FAULT: "COORDINATED_FAULT",
  GLOBAL_CONTEXT_SHIFT: "GLOBAL_CONTEXT_SHIFT",
});

const ACTIONS = Object.freeze({
  HOLD: "HOLD",
  INSPECT_LOCAL: "INSPECT_LOCAL",
  THROTTLE: "THROTTLE",
  THROTTLE_AND_ESCALATE: "THROTTLE_AND_ESCALATE",
  ADAPT_BASELINE: "ADAPT_BASELINE",
  SAFE_STOP: "SAFE_STOP",
  REQUIRE_AUTHORIZATION: "REQUIRE_AUTHORIZATION",
});

function clamp(x, lo, hi) {
  return Math.max(lo, Math.min(hi, x));
}

function mean(xs) {
  return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 0;
}

function normalize(dist) {
  const total = Object.values(dist).reduce((a, b) => a + b, 0) || 1;
  const out = {};
  for (const [key, value] of Object.entries(dist)) out[key] = value / total;
  return out;
}

function argMax(keys, score) {
  let best = keys[0];
  let bestScore = score(best);
  for (const key of keys.slice(1)) {
    const s = score(key);
    if (s > bestScore) {
      best = key;
      bestScore = s;
    }
  }
  return best;
}

function scalar(value, fallback = 0) {
  return Number.isFinite(value) ? value : fallback;
}

function contextShiftRiskSeed(loadRisk, heatRisk) {
  return Math.max(0.1, loadRisk + heatRisk * 0.25);
}

function featureVector(frame) {
  const vibration = Array.isArray(frame.vibration) ? frame.vibration : [];
  const tactile = Array.isArray(frame.tactile) ? frame.tactile : [];
  const force = scalar(frame.force);
  const torque = scalar(frame.torque);
  const current = scalar(frame.current);
  const temperature = scalar(frame.temperature);
  const position = scalar(frame.position);
  const velocity = scalar(frame.velocity);

  let vibrationEnergy = 0;
  let peakDelta = 0;
  for (let i = 1; i < vibration.length; i++) {
    const d = Math.abs(vibration[i] - vibration[i - 1]);
    vibrationEnergy += d;
    peakDelta = Math.max(peakDelta, d);
  }
  vibrationEnergy = vibration.length > 1 ? vibrationEnergy / (vibration.length - 1) : 0;

  const tactileMean = mean(tactile);
  let tactileSpread = 0;
  for (const v of tactile) tactileSpread += Math.abs(v - tactileMean);
  tactileSpread = tactile.length ? tactileSpread / tactile.length : 0;

  return {
    load: Math.abs(force) + Math.abs(torque) + Math.abs(current) * 0.35,
    heat: Math.abs(temperature),
    motion: Math.abs(position) * 0.05 + Math.abs(velocity),
    vibrationEnergy,
    peakDelta,
    tactileMean,
    tactileSpread,
  };
}

class BaselineModel {
  constructor(learningRate = 0.04) {
    this.learningRate = learningRate;
    this.center = null;
    this.scale = null;
  }

  calibrate(frames) {
    const features = frames.map(featureVector);
    this.center = {};
    this.scale = {};
    for (const key of Object.keys(features[0] || featureVector({}))) {
      const values = features.map((f) => f[key]);
      const m = mean(values);
      const mad = mean(values.map((v) => Math.abs(v - m)));
      this.center[key] = m;
      this.scale[key] = Math.max(0.1, mad);
    }
  }

  isReady() {
    return this.center !== null && this.scale !== null;
  }

  residual(features) {
    if (!this.isReady()) throw new Error("ASC_WR_UNCALIBRATED");
    const out = {};
    for (const key of Object.keys(this.center)) {
      out[key] = (features[key] - this.center[key]) / this.scale[key];
    }
    return out;
  }

  adaptSafe(features) {
    if (!this.isReady()) throw new Error("ASC_WR_UNCALIBRATED");
    for (const key of Object.keys(this.center)) {
      this.center[key] = this.center[key] * (1 - this.learningRate) + features[key] * this.learningRate;
      const absResidual = Math.abs(features[key] - this.center[key]);
      this.scale[key] = Math.max(0.1, this.scale[key] * 0.98 + absResidual * 0.02);
    }
  }

  exportState() {
    return {
      learningRate: this.learningRate,
      center: this.center,
      scale: this.scale,
    };
  }

  importState(snapshot) {
    this.learningRate = snapshot.learningRate;
    this.center = snapshot.center;
    this.scale = snapshot.scale;
  }
}

// Tracks slow irreversible drift across ticks. This is the component the
// Problem Statement requires but the original per-frame core lacked:
// it distinguishes monotonic departure (real fault onset) from fluctuation
// that returns toward baseline (benign context shift), and applies hysteresis
// so transient noise does not trip the alarm.
class DriftTracker {
  constructor(options = {}) {
    // Keys whose directional drift matters most for the frog-in-water case.
    this.keys = options.keys || ["load", "heat"];
    this.window = options.window ?? 12;        // long averaging window
    this.leak = options.leak ?? 0.10;          // chronic accumulator leak
    this.rateDeadband = options.rateDeadband ?? 0.04; // ignore rate below this (noise)
    this.tHigh = options.tHigh ?? 2.2;         // alarm threshold (raise)
    this.tLow = options.tLow ?? 1.1;           // clear threshold (hysteresis)
    this.reset();
  }

  reset() {
    this.prev = {};          // previous residual level per key (for rate)
    this.chronic = {};       // leaky accumulator of directional drift RATE
    this.peakLevel = {};     // peak absolute level departure reached per key
    this.history = {};       // recent rate signs per key (irreversibility window)
    for (const key of this.keys) {
      this.prev[key] = null;
      this.chronic[key] = 0;
      this.peakLevel[key] = 0;
      this.history[key] = [];
    }
    this.driftAlarm = false; // hysteresis latch
  }

  // Called once per tick with the normalized residual map from BaselineModel.
  // KEY IDEA: accumulate the RATE of change of the residual (its derivative),
  // not the residual level. A steady offset has zero rate -> no accumulation.
  // A monotonically climbing offset has positive rate -> accumulates (fault).
  // An offset that rises then returns has rate that flips sign -> cancels out
  // (benign context shift). This is the frog-in-water discriminator.
  update(residual) {
    let maxIrreversibility = 0;
    let maxDrift = 0;
    let returning = false;

    let maxLevelDeparture = 0;

    for (const key of this.keys) {
      const level = residual[key] ?? 0;
      const prev = this.prev[key];
      this.prev[key] = level;

      // Track peak absolute departure from baseline reached during this drift,
      // and the current level. A drift is only "returning" when the CURRENT
      // level has fallen back well below the peak it reached — not when the
      // rate accumulator merely plateaus. This fixes the bug where a still-
      // climbing signal was misread as a settled context shift.
      const absLevel = Math.abs(level);
      this.peakLevel[key] = Math.max(this.peakLevel[key] ?? 0, absLevel);
      maxLevelDeparture = Math.max(maxLevelDeparture, absLevel);

      if (prev === null) continue; // need two samples for a rate

      const rate = level - prev; // residual derivative this tick

      // Directional accumulation with leak, driven by RATE above a deadband.
      this.chronic[key] *= 1 - this.leak;
      const dir = rate > this.rateDeadband ? 1 : rate < -this.rateDeadband ? -1 : 0;
      if (dir !== 0) this.chronic[key] += dir;

      // Windowed sign-consistency of the RATE: monotonic climb = consistent sign.
      const hist = this.history[key];
      hist.push(dir);
      if (hist.length > this.window) hist.shift();
      const signNet = hist.reduce((a, b) => a + b, 0);
      const active = hist.filter((s) => s !== 0).length || 1;
      const consistency = Math.abs(signNet) / active; // 0..1, 1 = perfectly monotonic

      // Drift magnitude is gated by BOTH the rate accumulator and the level
      // departure: a signal sitting far from baseline keeps drift high even if
      // its rate accumulator has saturated.
      const driftMagnitude = Math.max(Math.abs(this.chronic[key]), absLevel) * Math.max(consistency, absLevel > this.tHigh ? 1 : 0);
      maxDrift = Math.max(maxDrift, driftMagnitude);
      maxIrreversibility = Math.max(maxIrreversibility, consistency);

      // TRUE return: current level has fallen back substantially from the peak
      // departure this drift reached (signal is recovering toward baseline).
      // Rate-plateau is NOT return; this requires the actual level to drop.
      const peak = this.peakLevel[key];
      if (peak > this.tLow && absLevel < peak * 0.6) {
        returning = true;
        this.peakLevel[key] = Math.max(absLevel, this.tLow); // decay peak as it recovers
      }
    }

    // Hysteresis: raise at tHigh, clear only below tLow.
    if (maxDrift > this.tHigh) this.driftAlarm = true;
    else if (maxDrift < this.tLow) this.driftAlarm = false;

    return {
      driftMagnitude: maxDrift,
      irreversibility: maxIrreversibility,
      levelDeparture: maxLevelDeparture,
      returning,
      driftAlarm: this.driftAlarm,
    };
  }

  exportState() {
    return {
      keys: this.keys,
      window: this.window,
      leak: this.leak,
      rateDeadband: this.rateDeadband,
      tHigh: this.tHigh,
      tLow: this.tLow,
      prev: this.prev,
      chronic: this.chronic,
      peakLevel: this.peakLevel,
      history: this.history,
      driftAlarm: this.driftAlarm,
    };
  }

  importState(snapshot) {
    Object.assign(this, snapshot);
  }
}

class FrontalStateEstimator {
  constructor() {
    this.belief = {
      [STATES.NORMAL]: 1,
      [STATES.LOCAL_WOUND]: 0,
      [STATES.IRREVERSIBLE_DRIFT]: 0,
      [STATES.COORDINATED_FAULT]: 0,
      [STATES.GLOBAL_CONTEXT_SHIFT]: 0,
    };
    this.transition = {};
    const states = Object.values(STATES);
    const self = 0.72;
    const other = (1 - self) / (states.length - 1);
    for (const from of states) {
      this.transition[from] = {};
      for (const to of states) this.transition[from][to] = from === to ? self : other;
    }
  }

  infer(scores) {
    const prior = {};
    for (const to of Object.values(STATES)) {
      prior[to] = 0;
      for (const from of Object.values(STATES)) prior[to] += this.belief[from] * this.transition[from][to];
    }

    const likelihood = this.softmax(scores);
    const posterior = {};
    for (const state of Object.values(STATES)) posterior[state] = prior[state] * likelihood[state];
    this.belief = normalize(posterior);

    const state = argMax(Object.values(STATES), (s) => this.belief[s]);
    return {
      state,
      confidence: this.belief[state],
      likelihood,
      belief: { ...this.belief },
    };
  }

  softmax(scores) {
    const maxScore = Math.max(...Object.values(scores));
    const exp = {};
    for (const [key, value] of Object.entries(scores)) exp[key] = Math.exp(value - maxScore);
    return normalize(exp);
  }

  exportState() {
    return {
      belief: this.belief,
      transition: this.transition,
    };
  }

  importState(snapshot) {
    this.belief = snapshot.belief;
    this.transition = snapshot.transition;
  }
}

class FrontalActionPolicy {
  constructor() {
    this.q = {};
    for (const state of Object.values(STATES)) {
      this.q[state] = {
        [ACTIONS.HOLD]: 0,
        [ACTIONS.INSPECT_LOCAL]: 0,
        [ACTIONS.THROTTLE]: 0,
        [ACTIONS.THROTTLE_AND_ESCALATE]: 0,
        [ACTIONS.ADAPT_BASELINE]: 0,
        [ACTIONS.SAFE_STOP]: -0.2,
      };
    }
    this.q[STATES.NORMAL][ACTIONS.HOLD] = 0.8;
    this.q[STATES.LOCAL_WOUND][ACTIONS.INSPECT_LOCAL] = 0.6;
    this.q[STATES.IRREVERSIBLE_DRIFT][ACTIONS.THROTTLE_AND_ESCALATE] = 0.7;
    this.q[STATES.COORDINATED_FAULT][ACTIONS.THROTTLE] = 0.7;
    this.q[STATES.GLOBAL_CONTEXT_SHIFT][ACTIONS.ADAPT_BASELINE] = 0.6;
  }

  choose(inference, risk) {
    const inhibited = [];
    if (
      risk.faultRisk > 2.0 ||
      inference.belief[STATES.COORDINATED_FAULT] > 0.25 ||
      inference.belief[STATES.IRREVERSIBLE_DRIFT] > 0.25 ||
      risk.driftCaution
    ) {
      inhibited.push(ACTIONS.ADAPT_BASELINE);
    }
    if (risk.severeRisk > 0.80) {
      return { action: ACTIONS.SAFE_STOP, inhibited };
    }
    const allowed = Object.values(ACTIONS).filter((a) => !inhibited.includes(a));
    const action = argMax(allowed, (a) => this.q[inference.state][a]);
    return { action, inhibited };
  }

  learn(state, action, reward) {
    const old = this.q[state][action];
    this.q[state][action] = old + 0.12 * (reward - old);
  }

  exportState() {
    return { q: this.q };
  }

  importState(snapshot) {
    this.q = snapshot.q;
  }
}

class AscWrFrontalEdgeLayer {
  constructor(options = {}) {
    this.options = {
      safeAdaptConfidence: options.safeAdaptConfidence ?? 0.65,
      severeStopRisk: options.severeStopRisk ?? 0.92,
      learningRate: options.learningRate ?? 0.04,
      humanSafetyUncertaintyStop: options.humanSafetyUncertaintyStop ?? 0.82,
    };
    this.baseline = new BaselineModel(this.options.learningRate);
    this.drift = new DriftTracker(options.drift);
    this.estimator = new FrontalStateEstimator();
    this.policy = new FrontalActionPolicy();
    this.lastVerdict = null;
  }

  calibrate(frames) {
    if (!Array.isArray(frames) || frames.length === 0) throw new Error("ASC_WR_EMPTY_CALIBRATION");
    this.baseline.calibrate(frames);
    this.drift.reset();
  }

  tick(frame) {
    const features = featureVector(frame);
    const residual = this.baseline.residual(features);
    const drift = this.drift.update(residual);
    const derived = this.deriveSignals(residual, drift);
    const scores = this.scoreStates(derived);
    const inference = this.estimator.infer(scores);
    const decision = this.applyHumanSafetyContract(frame, inference, derived, this.policy.choose(inference, derived));

    const dangerousAdaptationBlocked = decision.inhibited.includes(ACTIONS.ADAPT_BASELINE) || derived.driftCaution;
    const canAdapt =
      decision.action === ACTIONS.ADAPT_BASELINE &&
      inference.state === STATES.GLOBAL_CONTEXT_SHIFT &&
      inference.confidence >= this.options.safeAdaptConfidence &&
      !derived.driftCaution &&
      !dangerousAdaptationBlocked;

    if (canAdapt) this.baseline.adaptSafe(features);

    const verdict = {
      actuatorId: frame.actuatorId ?? "unknown",
      timestamp: frame.timestamp ?? Date.now(),
      state: inference.state,
      confidence: Number(inference.confidence.toFixed(4)),
      action: decision.action,
      inhibited: decision.inhibited,
      dangerousAdaptationBlocked,
      humanSafetyCritical: Boolean(frame.humanSafetyCritical),
      safetyLockActive: Boolean(decision.safetyLockActive),
      explanation: {
        localRisk: Number(derived.localRisk.toFixed(4)),
        faultRisk: Number(derived.faultRisk.toFixed(4)),
        contextShiftRisk: Number(derived.contextShiftRisk.toFixed(4)),
        severeRisk: Number(derived.severeRisk.toFixed(4)),
        driftMagnitude: Number(drift.driftMagnitude.toFixed(4)),
        irreversibility: Number(drift.irreversibility.toFixed(4)),
        driftAlarm: drift.driftAlarm,
        humanSafetyReason: decision.humanSafetyReason ?? "not_safety_critical",
        belief: Object.fromEntries(Object.entries(inference.belief).map(([k, v]) => [k, Number(v.toFixed(4))])),
      },
    };
    this.lastVerdict = verdict;
    return verdict;
  }

  reward(value) {
    if (!this.lastVerdict) return;
    this.policy.learn(this.lastVerdict.state, this.lastVerdict.action, value);
  }

  commitSafeBaseline(frame) {
    const features = featureVector(frame);
    this.baseline.adaptSafe(features);
  }

  lockAdaptation(reason = "manual_lock") {
    this.lastVerdict = {
      ...(this.lastVerdict || {}),
      inhibited: [...new Set([...(this.lastVerdict?.inhibited || []), ACTIONS.ADAPT_BASELINE])],
      dangerousAdaptationBlocked: true,
      lockReason: reason,
    };
  }

  deriveSignals(residual, drift = { driftMagnitude: 0, irreversibility: 0, returning: false, driftAlarm: false }) {
    const loadRisk = Math.abs(residual.load);
    const heatRisk = Math.abs(residual.heat);
    const vibrationRisk = Math.abs(residual.vibrationEnergy) + Math.abs(residual.peakDelta) * 0.45;
    const tactileRisk = Math.abs(residual.tactileSpread) + Math.abs(residual.tactileMean) * 0.25;
    const motionRisk = Math.abs(residual.motion);

    // Texture-based fault evidence: SHARP, coordinated, fault-like signature only.
    // Driven by vibration energy/peak structure. A focal load/force spike alone
    // is LOCAL_WOUND, not coordinated fault, so load no longer feeds texture.
    const textureFault = vibrationRisk * 0.7;

    // Irreversible drift: monotonic, non-returning rate. This alone is NOT a
    // hard fault — a benign load ramp looks identical while still rising. Drift
    // raises caution (blocks adaptation) and routes to IRREVERSIBLE_DRIFT; it
    // escalates to COORDINATED_FAULT only when fault texture co-occurs.
    // levelDeparture keeps drift alive when the rate accumulator has saturated
    // but the signal is still sitting far from baseline (the plateau bug fix).
    const sustainedDeparture = drift.returning ? 0 : (drift.levelDeparture ?? 0);
    const irreversibleDrift = drift.returning
      ? 0
      : Math.max(drift.driftMagnitude * drift.irreversibility, sustainedDeparture);

    const localRisk = Math.max(tactileRisk, motionRisk, loadRisk * 0.55);

    // Fault = texture, boosted when strong irreversible drift co-occurs with texture.
    const faultRisk = textureFault + (irreversibleDrift > 1.5 ? textureFault * 0.5 : 0);

    const focalDominance = tactileRisk / Math.max(0.1, contextShiftRiskSeed(loadRisk, heatRisk));

    // Context-shift risk reflects reversible/returning movement only. A large
    // sustained departure that has NOT returned suppresses context-shift, so a
    // still-elevated signal cannot be relabeled as a settled context shift.
    const reversibleDrift = drift.returning ? drift.driftMagnitude : 0;
    const contextShiftRisk = Math.max(
      0,
      loadRisk + heatRisk * 0.25 - vibrationRisk * 0.55 - tactileRisk * 0.45 + reversibleDrift * 0.20 - irreversibleDrift * 0.6 - sustainedDeparture * 0.5,
    );

    // severeRisk gates the hard SAFE_STOP. Systemic fault texture dominates it;
    // pure drift contributes only mildly and saturates, so a slow non-texture
    // drift sustains THROTTLE_AND_ESCALATE rather than immediately hard-stopping.
    const severeRisk = clamp((faultRisk + Math.min(irreversibleDrift, 4) * 0.18) / 8, 0, 1);

    // Caution flag: drift active and not yet proven reversible -> do not adapt.
    const driftCaution = drift.driftAlarm && !drift.returning;

    return { localRisk, faultRisk, contextShiftRisk, severeRisk, tactileRisk, focalDominance, irreversibleDrift, driftCaution };
  }

  applyHumanSafetyContract(frame, inference, risk, decision) {
    const inhibited = new Set(decision.inhibited);
    const hazardousActions = new Set(frame.hazardousActions || []);
    const humanSafetyCritical = Boolean(frame.humanSafetyCritical) || hazardousActions.size > 0;

    if (!humanSafetyCritical) {
      return { ...decision, inhibited: [...inhibited] };
    }

    inhibited.add(ACTIONS.ADAPT_BASELINE);
    for (const action of hazardousActions) inhibited.add(action);

    const explicitlyAuthorized = Boolean(frame.safeAuthorization);
    const uncertain = inference.confidence < this.options.humanSafetyUncertaintyStop;
    const faultLike =
      inference.state === STATES.COORDINATED_FAULT ||
      inference.state === STATES.IRREVERSIBLE_DRIFT ||
      risk.faultRisk > 1.5 ||
      risk.severeRisk > 0.35 ||
      risk.driftCaution;

    if (faultLike) {
      return {
        action: ACTIONS.SAFE_STOP,
        inhibited: [...inhibited],
        safetyLockActive: true,
        humanSafetyReason: "fault_like_signal_in_human_safety_critical_node",
      };
    }

    if (uncertain) {
      return {
        action: ACTIONS.SAFE_STOP,
        inhibited: [...inhibited],
        safetyLockActive: true,
        humanSafetyReason: "uncertain_state_in_human_safety_critical_node",
      };
    }

    if (hazardousActions.has(decision.action) && !explicitlyAuthorized) {
      return {
        action: ACTIONS.REQUIRE_AUTHORIZATION,
        inhibited: [...inhibited],
        safetyLockActive: true,
        humanSafetyReason: "hazardous_action_requires_explicit_safe_authorization",
      };
    }

    if (decision.action === ACTIONS.ADAPT_BASELINE) {
      return {
        action: ACTIONS.HOLD,
        inhibited: [...inhibited],
        safetyLockActive: true,
        humanSafetyReason: "baseline_adaptation_locked_for_human_safety_critical_node",
      };
    }

    return {
      ...decision,
      inhibited: [...inhibited],
      safetyLockActive: true,
      humanSafetyReason: "human_safety_constraints_active",
    };
  }

  scoreStates(risk) {
    return {
      [STATES.NORMAL]: 2.2 - risk.localRisk * 0.8 - risk.faultRisk * 0.95 - risk.contextShiftRisk * 0.45 - risk.irreversibleDrift * 0.9,
      [STATES.LOCAL_WOUND]: risk.localRisk * 1.35 + risk.tactileRisk * 0.65 + risk.focalDominance * 0.75 - risk.faultRisk * 0.35 - risk.contextShiftRisk * 0.18 - risk.irreversibleDrift * 0.5,
      // Irreversible drift WITHOUT fault-like texture: the slow frog-in-water case.
      // Strong when drift is monotonic and texture is low; loses to COORDINATED_FAULT
      // as soon as real fault texture appears.
      [STATES.IRREVERSIBLE_DRIFT]: risk.irreversibleDrift * 1.45 - risk.faultRisk * 0.85 - risk.localRisk * 0.4,
      [STATES.COORDINATED_FAULT]: risk.faultRisk * 1.35 + risk.severeRisk * 2.0,
      // Context shift only when drift is reversible: irreversible drift suppresses it.
      [STATES.GLOBAL_CONTEXT_SHIFT]: risk.contextShiftRisk * 1.05 - risk.faultRisk * 0.75 - risk.tactileRisk * 0.55 - risk.focalDominance * 0.35 - risk.irreversibleDrift * 0.75,
    };
  }

  exportState() {
    return {
      version: "ASC_WR_FRONTAL_EDGE_LAYER_CORE_V1",
      options: this.options,
      baseline: this.baseline.exportState(),
      drift: this.drift.exportState(),
      estimator: this.estimator.exportState(),
      policy: this.policy.exportState(),
      lastVerdict: this.lastVerdict,
    };
  }

  importState(snapshot) {
    this.options = snapshot.options;
    this.baseline.importState(snapshot.baseline);
    if (snapshot.drift) this.drift.importState(snapshot.drift);
    this.estimator.importState(snapshot.estimator);
    this.policy.importState(snapshot.policy);
    this.lastVerdict = snapshot.lastVerdict;
  }
}


// ================================================================

var $ = function(id){return document.getElementById(id);};
var STATE_COLORS={NORMAL:"var(--normal)",IRREVERSIBLE_DRIFT:"var(--drift)",LOCAL_WOUND:"var(--wound)",COORDINATED_FAULT:"var(--fault)",GLOBAL_CONTEXT_SHIFT:"var(--shift)"};

var layer=null, calibrating=false, calBuffer=[], last={x:0,y:0,z:0}, evCount=0, sensorAlive=false, vibWindow=[];

function diag(msg, cls){
  var d=$("diag");
  var span = cls ? '<span class="'+cls+'">'+msg+'</span>' : msg;
  d.innerHTML = span + "\n" + d.innerHTML;
}

function toFrame(ax,ay,az,t){
  var mag=Math.sqrt(ax*ax+ay*ay+az*az);
  vibWindow.push(mag); if(vibWindow.length>8) vibWindow.shift();
  return {timestamp:t,actuatorId:"phone",force:ax,torque:ay,current:Math.abs(az),
    temperature:0,position:0,velocity:mag,vibration:vibWindow.slice(),tactile:[Math.abs(ax),Math.abs(ay)]};
}

// --- sensor input: try DeviceMotion first, fall back to Accelerometer API ---
function onMotion(e){
  var a=e.accelerationIncludingGravity||e.acceleration;
  if(!a||(a.x==null&&a.y==null&&a.z==null)) return;
  last={x:a.x||0,y:a.y||0,z:a.z||0};
  evCount++; sensorAlive=true;
}

function startDeviceMotion(){
  window.addEventListener("devicemotion", onMotion, true);
  diag("слушаю devicemotion...", "ok");
  // after 1.2s check if any events arrived; if not, try Accelerometer API
  setTimeout(function(){
    if(evCount===0){
      diag("devicemotion молчит — пробую Accelerometer API...", "warn");
      tryGenericSensor();
    } else {
      diag("✔ датчик жив, событий: "+evCount, "ok");
      beginCalibration();
    }
  }, 1200);
}

function tryGenericSensor(){
  if(typeof Accelerometer==="undefined"){
    diag("✖ Accelerometer API недоступен в этом браузере", "err");
    diag("датчик движения не отдаёт данные.", "err");
    return;
  }
  try{
    var acc=new Accelerometer({frequency:30});
    acc.addEventListener("reading", function(){
      last={x:acc.x||0,y:acc.y||0,z:acc.z||0};
      evCount++; sensorAlive=true;
    });
    acc.addEventListener("error", function(ev){
      diag("✖ Accelerometer error: "+(ev.error&&ev.error.name), "err");
    });
    acc.start();
    diag("Accelerometer API запущен...", "ok");
    setTimeout(function(){
      if(evCount===0){ diag("✖ Accelerometer тоже молчит", "err"); }
      else { diag("✔ датчик жив (Generic Sensor), событий: "+evCount, "ok"); beginCalibration(); }
    }, 1200);
  }catch(err){
    diag("✖ Accelerometer исключение: "+err.message, "err");
  }
}

function beginCalibration(){
  $("setup").classList.add("hidden");
  $("runtime").classList.remove("hidden");
  calibrating=true; calBuffer=[];
  var t0=performance.now();
  (function tick(){
    calBuffer.push(toFrame(last.x,last.y,last.z,performance.now()));
    if(performance.now()-t0<2000){ requestAnimationFrame(tick); }
    else{
      layer=new AscWrFrontalEdgeLayer({drift:{keys:["load","motion"],window:14,leak:0.10,rateDeadband:0.15,tHigh:3.0,tLow:1.2}});
      try{ layer.calibrate(calBuffer); }catch(e){}
      calibrating=false; loop();
    }
  })();
}

var lastState=null;
function loop(){
  if(layer&&!calibrating){
    var v;
    try{ v=layer.tick(toFrame(last.x,last.y,last.z,performance.now())); }catch(e){ requestAnimationFrame(loop); return; }
    var ex=v.explanation;
    $("stateName").textContent=v.state;
    $("actionName").textContent="→ "+v.action+(v.dangerousAdaptationBlocked?" · adapt blocked":"");
    $("conf").textContent=(v.confidence*100).toFixed(0)+"%";
    $("stage").style.setProperty("--state-color",STATE_COLORS[v.state]||"var(--normal)");
    setBar("Drift",ex.driftMagnitude,12);
    setBar("Fault",ex.faultRisk,6);
    setBar("Local",ex.localRisk,12);
    setBar("Severe",ex.severeRisk,1);
    $("ax").textContent=last.x.toFixed(2);
    $("ay").textContent=last.y.toFixed(2);
    $("az").textContent=last.z.toFixed(2);
    $("evcount").textContent=evCount;
  }
  requestAnimationFrame(loop);
}
function setBar(n,val,max){
  var pct=Math.max(0,Math.min(100,(val/max)*100));
  $("bar"+n).style.width=pct+"%";
  $("val"+n).textContent=(typeof val==="number"?val.toFixed(n==="Severe"?2:1):val);
}

function go(){
  diag("запуск...", "");
  // iOS needs explicit permission from a user gesture
  if(typeof DeviceMotionEvent!=="undefined" && typeof DeviceMotionEvent.requestPermission==="function"){
    diag("запрашиваю разрешение (iOS)...", "warn");
    DeviceMotionEvent.requestPermission().then(function(res){
      diag("разрешение: "+res, res==="granted"?"ok":"err");
      if(res==="granted") startDeviceMotion();
      else diag("✖ доступ к движению запрещён", "err");
    }).catch(function(err){ diag("✖ requestPermission: "+err.message, "err"); });
  } else {
    diag("браузер без iOS-запроса (Android/desktop)", "");
    startDeviceMotion();
  }
}

$("startBtn").addEventListener("click", go);
$("recalBtn").addEventListener("click", function(){
  calibrating=true; calBuffer=[]; var t0=performance.now();
  (function tick(){
    calBuffer.push(toFrame(last.x,last.y,last.z,performance.now()));
    if(performance.now()-t0<2000){ requestAnimationFrame(tick); }
    else{ try{layer.calibrate(calBuffer);}catch(e){} calibrating=false; }
  })();
});

// show environment up front
diag("протокол: "+location.protocol, location.protocol==="https:"?"ok":"err");
diag("DeviceMotionEvent: "+(typeof DeviceMotionEvent!=="undefined"?"есть":"НЕТ"), typeof DeviceMotionEvent!=="undefined"?"ok":"err");
diag("Accelerometer API: "+(typeof Accelerometer!=="undefined"?"есть":"нет"), typeof Accelerometer!=="undefined"?"ok":"warn");
</script>
</body>
